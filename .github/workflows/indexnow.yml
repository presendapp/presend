name: IndexNow Submit

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch: {}

jobs:
  indexnow:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run IndexNow submission
        run: python3 indexnow_submit.py
