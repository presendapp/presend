<title>Präsentieren Sie Admin – Analytics-Dashboard</title>
<link href="style.css" rel="stylesheet"/>
<style>
    .admin-container { max-width: 900px; margin: 0 auto; padding: 2rem; }
    .stat-card { background: #f8f9fa; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; border-left: 4px solid #0066cc; }
    .stat-number { font-size: 2.5rem; font-weight: 700; color: #0066cc; }
    .tool-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #e9ecef; }
    .loading { color: #6c757d; font-style: italic; }
    .error { color: #dc3545; }
  </style>
<meta property="og:locale" content="de_DE" />
<link rel="alternate" hreflang="en" href="https://presend.pages.dev/admin" />
<link rel="alternate" hreflang="fr" href="https://presend.pages.dev/fr/admin" />
<link rel="alternate" hreflang="es" href="https://presend.pages.dev/es/admin" />
<link rel="alternate" hreflang="de" href="https://presend.pages.dev/de/admin" />
<link rel="alternate" hreflang="pt" href="https://presend.pages.dev/pt/admin" />
<link rel="alternate" hreflang="ja" href="https://presend.pages.dev/ja/admin" />
<link rel="alternate" hreflang="ru" href="https://presend.pages.dev/ru/admin" />
<link rel="alternate" hreflang="hi" href="https://presend.pages.dev/hi/admin" />
<link rel="alternate" hreflang="x-default" href="https://presend.pages.dev/" />
</head>
<body>
<div class="admin-container">
<h1>📊 Präsentieren Sie Analytics</h1>
<p class="loading" id="status">Statistiken werden geladen...</p>
<div class="stat-card">
<div class="stat-number" id="total">—</div>
<div>Gesamtzahl der verfolgten Aktionen</div>
</div>
<div class="stat-card">
<h2>Nach Werkzeug</h2>
<div id="tools-list">Beladen...</div>
</div>
<p style="margin-top: 2rem; color: #6c757d; font-size: 0.9rem;">🔒 Datenschutz gilt vor: keine Cookies, keine IP-Speicherung, kein Tracker von Drittanbietern.</p>
</div>
<script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        
        document.getElementById('status').textContent = 'Last updated: ' + new Date().toLocaleString();
        document.getElementById('total').textContent = data.total.toLocaleString();
        
        const toolsDiv = document.getElementById('tools-list');
        if (!data.tools || Object.keys(data.tools).length === 0) {
          toolsDiv.innerHTML = '<p>No data yet.</p>';
          return;
        }
        
        let html = '';
        for (const [tool, dates] of Object.entries(data.tools)) {
          const toolTotal = Object.values(dates).reduce((a, b) => a + b, 0);
          html += `<div class="tool-row"><strong>${tool}</strong> <span>${toolTotal.toLocaleString()}</span></div>`;
          for (const [date, count] of Object.entries(dates)) {
            html += `<div class="tool-row" style="padding-left: 1rem; font-size: 0.9rem; color: #6c757d;">
              ${date} — ${count.toLocaleString()}
            </div>`;
          }
        }
        toolsDiv.innerHTML = html;
      } catch (e) {
        document.getElementById('status').textContent = 'Error loading stats';
        document.getElementById('status').className = 'error';
      }
    }
    
    loadStats();
    setInterval(loadStats, 30000);
  </script>Cloudflare-Webanalyse<script data-cf-beacon='{"token": "37606631a94f4ce69f54a301c7763f01"}' src="https://static.cloudflareinsights.com/beacon.min.js" type="module"></script>Beenden Sie Cloudflare Web Analytics<script>

</body>
