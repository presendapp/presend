[build]
  publish = "."

[[redirects]]
  from = "/tools/exif-remover.html"
  to = "/tools/exif-remover"
  status = 301
  force = true

[[redirects]]
  from = "/tools/pdf-metadata-remover.html"
  to = "/tools/pdf-metadata-remover"
  status = 301
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

[[headers]]
  for = "/*.mp4"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/og-image.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/favicon.ico"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
