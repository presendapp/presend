name: SEO Automation

on:
  schedule:
    - cron: '0 6 * * *'
    - cron: '0 9 * * *'
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

jobs:
  indexnow:
    if: github.event.schedule == '0 6 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run IndexNow submission
        run: python3 indexnow_submit.py

  daily-seo:
    if: github.event.schedule == '0 9 * * *' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib
      - name: Decode and write Google service account credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -c "
          import base64, os, json
          b64 = os.environ['GOOGLE_CREDS_B64']
          print(f'Base64 length: {len(b64)} chars')
          decoded = base64.b64decode(b64)
          with open('google-service-account.json', 'wb') as f:
              f.write(decoded)
          with open('google-service-account.json', 'r') as f:
              data = json.load(f)
          print(f'OK - project: {data[\"project_id\"]}')
          "
      - name: Run daily SEO
        run: python3 daily_seo.py
      - name: Clean up credentials
        if: always()
        run: rm -f google-service-account.json

  auto-discovery:
    if: github.event.schedule == '0 2 * * 0' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install google-auth google-auth-oauthlib
      - name: Decode and write Google service account credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -c "
          import base64, os
          with open('google-service-account.json', 'wb') as f:
              f.write(base64.b64decode(os.environ['GOOGLE_CREDS_B64']))
          "
      - name: Run auto discovery master
        run: bash auto_discovery_master.sh
      - name: Clean up credentials
        if: always()
        run: rm -f google-service-account.json
