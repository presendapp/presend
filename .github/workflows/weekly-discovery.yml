name: Weekly Discovery

on:
  schedule:
    # Dimanche 2h00 UTC, équivalent au cron local qu'on remplace
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

jobs:
  weekly-discovery:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Restore Google service account key
        run: echo "$GOOGLE_SERVICE_ACCOUNT_JSON" > google-service-account.json
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}

      - name: Run auto discovery master
        run: bash auto_discovery_master.sh

      - name: Clean up service account key
        if: always()
        run: rm -f google-service-account.json

      - name: Commit and push changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add sitemap.xml 2>/dev/null || true
          git diff --staged --quiet || git commit -m "chore: weekly discovery auto-update (sitemap)"
          git push
