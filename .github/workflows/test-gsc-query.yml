name: Test GSC Query (temporaire)

on:
  workflow_dispatch: {}

jobs:
  query:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Decode credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -c "
          import base64, os
          with open('google-service-account.json', 'wb') as f:
              f.write(base64.b64decode(os.environ['GOOGLE_CREDS_B64']))
          "
      - name: Run query
        run: python3 gsc_query.py
      - name: Clean up credentials
        if: always()
        run: rm -f google-service-account.json
