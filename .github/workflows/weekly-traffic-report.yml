name: Weekly traffic report

on:
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch: {}

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Decode Google service account credentials
        env:
          GOOGLE_CREDS_B64: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -c "
          import base64, os
          with open('google-service-account.json', 'wb') as f:
              f.write(base64.b64decode(os.environ['GOOGLE_CREDS_B64']))
          "
      - name: Post weekly report
        run: bash scripts/post-traffic-report.sh
        env:
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Clean up credentials
        if: always()
        run: rm -f google-service-account.json
