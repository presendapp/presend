<h1 style="font-family:var(--font-display);">プレゼンについて</h1>
<p style="color:var(--color-muted); max-width:60ch;">Presend は、ファイルを共有する前にファイルをクリーンアップ、圧縮、準備するように設計された、ブラウザベースのユーティリティの小規模で高速なコレクションです。すべてがブラウザ内でローカルに実行されます。アップロードもサーバーも追跡ありません。</p>
