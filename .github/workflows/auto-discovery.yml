name: Auto Discovery

on:
  schedule:
    - cron: '0 2 * * 0'
  workflow_dispatch: {}

jobs:
  auto-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # Note: no longer installs google-auth / decodes Google credentials.
      # auto_discovery_master.sh -> submit_all.py no longer uses the Google
      # Indexing API (disabled 2026-08-29, see submit_all.py header) since
      # it's officially restricted to JobPosting/BroadcastEvent content and
      # using it here risked Google Cloud access revocation for no benefit.
      - name: Run auto discovery master
        run: timeout 480 bash auto_discovery_master.sh || true
