    .stat-card { background: #f8f9fa; border-radius: 12px; padding: 1.5rem; margin: 1rem 0; border-left: 4px solid #0066cc; }
    .stat-number { font-size: 2.5rem; font-weight: 700; color: #0066cc; }
    .tool-row { display: flex; justify-content: space-between; padding: 0.75rem 0; border-bottom: 1px solid #e9ecef; }
    .loading { color: #6c757d; font-style: italic; }
    .error { color: #dc3545; }
  </style>

<meta name="keywords" content="free online tools, browser tools, file cleaner, compress files, convert files, privacy tools, no upload" />
</head>
<body>
  <div class="admin-container">
    <h1>📊 Presend Analytics</h1>
    <p class="loading" id="status">Loading stats...</p>
    
    <div class="stat-card">
      <div class="stat-number" id="total">—</div>
      <div>Total actions tracked</div>
    </div>
    
    <div class="stat-card">
      <h2>By Tool</h2>
      <div id="tools-list">Loading...</div>
    </div>
    
    <p style="margin-top: 2rem; color: #6c757d; font-size: 0.9rem;">
      🔒 Privacy-first: no cookies, no IP storage, no third-party trackers.
    </p>
  </div>

  <script>
    async function loadStats() {
      try {
        const res = await fetch('/api/stats');
        const data = await res.json();
        
        document.getElementById('status').textContent = 'Last updated: ' + new Date().toLocaleString();
        document.getElementById('total').textContent = data.total.toLocaleString();
        
        const toolsDiv = document.getElementById('tools-list');
        if (!data.tools || Object.keys(data.tools).length === 0) {
          toolsDiv.innerHTML = '<p>No data yet.</p>';
          return;
        }
        
        let html = '';
        for (const [tool, dates] of Object.entries(data.tools)) {
          const toolTotal = Object.values(dates).reduce((a, b) => a + b, 0);
          html += `<div class="tool-row"><strong>${tool}</strong> <span>${toolTotal.toLocaleString()}</span></div>`;
          for (const [date, count] of Object.entries(dates)) {
            html += `<div class="tool-row" style="padding-left: 1rem; font-size: 0.9rem; color: #6c757d;">
              ${date} — ${count.toLocaleString()}
            </div>`;
          }
        }
        toolsDiv.innerHTML = html;
      } catch (e) {
        document.getElementById('status').textContent = 'Error loading stats';
        document.getElementById('status').className = 'error';
      }
    }
    
    loadStats();
    setInterval(loadStats, 30000);
  </script>
